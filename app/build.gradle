plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}
def speakerIp = localProperties.getProperty('speaker.ip', '')
def speakerName = localProperties.getProperty('speaker.name', 'Smart Speaker')
def speakerRoom = localProperties.getProperty('speaker.room', 'Woonkamer')
def homeName = localProperties.getProperty('home.name', 'Smart Home')

android {
    namespace 'com.aura.tvlauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.aura.tvlauncher"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "SPEAKER_IP", "\"${speakerIp}\""
        buildConfigField "String", "DEFAULT_SPEAKER_NAME", "\"${speakerName}\""
        buildConfigField "String", "DEFAULT_SPEAKER_ROOM", "\"${speakerRoom}\""
        buildConfigField "String", "DEFAULT_HOME_NAME", "\"${homeName}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
